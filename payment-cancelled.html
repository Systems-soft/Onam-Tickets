<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Cancelled — Onam 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF2DE; --ink:#2A1A10; --ink-soft:#5C4630;
    --maroon:#7A1E2B; --line: rgba(42,26,16,0.18);
  }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--cream); color:var(--ink); font-family:'Work Sans', sans-serif;
    padding:24px; box-sizing:border-box; text-align:center;
  }
  .card{
    max-width:480px; background:#fff; border:1px solid var(--line); border-radius:18px;
    padding:40px 32px; box-shadow:0 18px 40px rgba(42,26,16,0.12);
  }
  .glyph{ font-size:44px; margin-bottom:14px; display:block; }
  h1{ font-family:'Fraunces', serif; font-size:26px; margin:0 0 10px; color:var(--maroon); }
  p{ color:var(--ink-soft); line-height:1.55; margin:0; }
  a.back{
    display:inline-block; margin-top:22px; color:var(--ink); font-weight:600; text-decoration:none;
    border-bottom:1px solid var(--ink);
  }
</style>
</head>
<body>
  <div class="card">
    <span class="glyph">✕</span>
    <h1>Checkout cancelled</h1>
    <p>No payment was made and your card was not charged. You can pick your tickets again anytime.</p>
    <a class="back" href="/onam-tickets.html">← Back to Onam 2026</a>
  </div>
</body>
</html>
